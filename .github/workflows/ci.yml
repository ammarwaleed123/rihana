name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — no value in finishing a build for
# a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Prisma's postinstall is skipped deliberately: it has hung on some
      # platforms, and `prisma generate` below does the work explicitly.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Guards against a secret being exposed through a NEXT_PUBLIC_ variable.
      - name: Check for exposed secrets
        run: npm run check:secrets

      - name: Test
        run: npm run test

      - name: Build
        run: npx next build
        env:
          # Build-time only. The app never connects during `next build`; these
          # satisfy env validation, and no real credential belongs in CI.
          APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build
          SESSION_SECRET: ci-build-placeholder-secret-value-32-chars-min
          EMAIL_FROM: ci@example.com
